[project]
name = "enterprise-doc-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "praneeth reddy", email = "praneethreddy2902@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.18,<1",
    "pyyaml>=6,<7",
    "psycopg[binary,pool]>=3.2,<4",
    "pgvector>=0.3,<1",
    "pydantic>=2,<3",
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.2",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = ["httpx>=0.27,<1"]

[project.scripts]
enterprise-doc-assistant = "enterprise_doc_assistant:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
